<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile JSON Lab</title>
</head>
<body>
    <h1>User Profiles</h1>
    <div id="userList"></div>

    <script>
        fetch('userProfiles.json')
        .then(response => {
            if (!response.ok) throw new Error('Fetch error: ' + response.status)
            else return response.json();
        })
        .then(json => {
            const container = document.getElementById("userList");
            json.forEach(user => {
                const div = document.createElement("div");
                div.style.border = "1px solid #ccc";
                div.style.padding = "10px";
                div.style.margin = "8px 0";
                div.innerHTML = `
                    <p><strong>Name:</strong> ${user.firstName} ${user.lastName}</p>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>Birth:</strong> ${user.dateOfBirth}</p>
                    <p><strong>Address:</strong> ${user.address.street}, ${user.address.city}, ${user.address.state}, ${user.address.zipCode}</p>
                    <p><strong>Preferences:</strong> Theme:${user.preferences.theme}, Lang:${user.preferences.language}, Notifications:${user.preferences.notifications}, Newsletter subscribed:${user.preferences.subscription}</p>
                `;
                container.appendChild(div);
            })
        })
        .catch(err => console.error('Fetch error: ' + err.message));
    </script>
</body>
</html>
